version: "3.9"

services:
  api:
    build: .
    container_name: weather-api
    restart: always
    env_file:
      - .env
    ports:
      - "8001:8001"
    depends_on:
      - db
    command: >
      uvicorn app.api:app
      --host 0.0.0.0
      --port 8001

  db:
    image: postgres:15
    container_name: weather-db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
